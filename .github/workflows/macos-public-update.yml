name: macOS public in-app update
on: workflow_dispatch
permissions:
  contents: read
jobs:
  upgrade:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      UPDATE_FROM_VERSION: '0.4.14'
    steps:
      - uses: actions/checkout@8f4b7f84864484a7bf31766abe9204da3cbe65b3
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the pinned public distribution on this disposable Mac
        shell: bash
        run: |
          set -euo pipefail
          asset="CC-Connect-${UPDATE_FROM_VERSION}-universal.dmg"
          artifact="$RUNNER_TEMP/$asset"
          mount="$RUNNER_TEMP/cc-connect-old-image"
          target="/Applications/CC Connect.app"
          test ! -e "$target"
          test ! -e "$HOME/Applications/CC Connect.app"
          mkdir "$mount"
          curl -fsSL --retry 2 --max-time 120 "https://github.com/stevenchengxy/cc-connect/releases/download/v${UPDATE_FROM_VERSION}/$asset" -o "$artifact"
          echo "f974f141880ea877755d55bb40693144b1e0e445d96853d7122556d84bffe143  $artifact" | shasum -a 256 -c -
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mount" "$artifact"
          trap 'hdiutil detach "$mount"' EXIT
          codesign --verify --deep --strict "$mount/CC Connect.app"
          ditto "$mount/CC Connect.app" "$target"
          codesign --verify --deep --strict "$target"
      - name: Check, download and install with the packaged app
        run: node scripts/verify-macos-public-update.cjs
