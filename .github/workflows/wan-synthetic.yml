name: WAN synthetic viewer
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Synthetic session to verify
        type: choice
        default: both
        options:
          - both
          - view
          - control
permissions:
  contents: read
jobs:
  receive:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      CC_WAN_QA_PAIR_URL: ${{ vars.CC_CONNECT_QA_PAIR_URL }}
    steps:
      - uses: actions/checkout@8f4b7f84864484a7bf31766abe9204da3cbe65b3
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the release's Electron runtime
        id: runtime
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Verify the view-only session
        if: inputs.mode != 'control'
        env:
          CC_WAN_QA_INVITE: ${{ secrets.CC_CONNECT_SYNTHETIC_WAN_031 }}
        run: xvfb-run -a node_modules/.bin/electron scripts/verify-wan-cross.cjs viewer view
      - name: Verify consensual test-surface control
        if: ${{ !cancelled() && inputs.mode != 'view' && steps.runtime.outcome == 'success' }}
        env:
          CC_WAN_QA_INVITE: ${{ secrets.CC_CONNECT_SYNTHETIC_WAN_031 }}
        run: xvfb-run -a node_modules/.bin/electron scripts/verify-wan-cross.cjs viewer control
