name: WAN synthetic viewer
on: workflow_dispatch
permissions:
  contents: read
jobs:
  receive:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@8f4b7f84864484a7bf31766abe9204da3cbe65b3
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Receive generated video
        env:
          CC_WAN_QA_INVITE: ${{ secrets.CC_CONNECT_SYNTHETIC_WAN_031 }}
        run: node scripts/verify-wan-cross.cjs viewer
