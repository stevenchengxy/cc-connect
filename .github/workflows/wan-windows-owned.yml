name: WAN owned Windows window
on:
  workflow_dispatch:
    inputs:
      viewer_public_key:
        description: Disposable Mac recipient RSA-3072 public key (SPKI Base64)
        required: true
        type: string
permissions:
  contents: read
jobs:
  host:
    if: github.repository == 'stevenchengxy/cc-connect' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      CC_QA_OWNED_WINDOWS: '1'
      CC_QA_CHROME: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
    steps:
      - uses: actions/checkout@8f4b7f84864484a7bf31766abe9204da3cbe65b3
        with:
          persist-credentials: false
      - name: Build isolated WinForms fixture
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          npm install --prefix (Join-Path $env:RUNNER_TEMP 'cc-owned-tools') --ignore-scripts --no-audit --no-fund '@actions/artifact@2.3.2'
          if ($LASTEXITCODE -ne 0) { throw 'Artifact client installation failed' }
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { throw 'Electron installation failed' }
          $csc = Join-Path $env:SystemRoot 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $fixture = Join-Path $env:RUNNER_TEMP 'CC-OwnedWindow-WAN.exe'
          $baseSource = (Resolve-Path 'scripts/windows-qa/NativeWindowCheck.cs').Path
          $wanSource = (Resolve-Path 'scripts/windows-qa/WanWindowCheck.cs').Path
          & $csc '/nologo' '/target:exe' '/platform:x64' '/define:OWNED_WINDOW_WAN' '/reference:System.Windows.Forms.dll' '/reference:System.Drawing.dll' "/out:$fixture" $baseSource $wanSource
          if ($LASTEXITCODE -ne 0) { throw 'Fixture compilation failed' }
      - name: Host the owned test window and verify its physical pixels
        uses: ./scripts/windows-qa/wan-action
        env:
          CC_QA_RUNNER_CLASS: ${{ runner.environment }}
          CC_WAN_QA_SESSION: ${{ secrets.CC_CONNECT_QA_WINDOWS_OWNED_HOST }}
          CC_QA_VIEWER_PUBLIC_KEY: ${{ inputs.viewer_public_key }}
