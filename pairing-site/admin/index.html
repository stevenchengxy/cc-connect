<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>CC Connect · Admin</title><link rel="stylesheet" href="/admin/base.css"><script src="/admin/app.js" defer></script></head>
<body><header><div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i></span>CC Connect</div><div class="toolbar"><label><span class="sr" data-t="language"></span><select id="lang"><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="en">English</option></select></label><button type="button" id="logout" hidden data-t="logout"></button></div></header>
<main><h1 data-t="console"></h1><p id="notice" role="status" aria-live="polite"></p>
<section id="signin" class="card login"><h2 data-t="signin"></h2><form id="login-form"><label><span data-t="user"></span><input name="username" autocomplete="username" maxlength="40" required></label><label><span data-t="password"></span><input name="password" type="password" autocomplete="current-password" maxlength="128" required></label><button class="primary" data-t="signin"></button></form></section>
<div id="workspace" hidden>
<section class="usage card"><div class="row"><h2 data-t="usage"></h2><button id="refresh" data-t="refresh"></button></div><div class="metrics"><div><span data-t="budgetUsage"></span><strong id="bytes">—</strong></div><div><span data-t="budget"></span><strong id="budget">—</strong></div><div><span data-t="relay"></span><strong id="mode">—</strong></div></div><div class="row foot"><span id="stamp"></span><button id="edit-global" data-t="quotaSettings"></button></div></section>
<section class="card"><div class="row"><h2 data-t="accounts"></h2><button class="primary" id="invite" data-t="newInvite"></button></div><div class="filters"><label><span class="sr" data-t="filter"></span><select id="filter"><option value="all" data-t="all"></option><option value="pending" data-t="pending"></option><option value="approved" data-t="approved"></option><option value="suspended" data-t="suspended"></option><option value="revoked" data-t="revoked"></option></select></label></div><div id="rows"></div><button id="more" hidden data-t="more"></button></section>
</div></main>
<dialog id="details"><form method="dialog" class="row"><h2 id="dialog-title"></h2><button aria-label="Close" class="close">×</button></form><div id="dialog-body"></div><p id="dialog-msg" role="status"></p></dialog></body></html>
