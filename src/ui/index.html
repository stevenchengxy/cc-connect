<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>CC Connect</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="i18n.js"></script>
  <script defer src="custom-select.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-display" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="13.5" rx="2"/><path d="M8 21h8m-4-3.5V21"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="m10 14 4-4m-6.4 2.2-2.8 2.9a3.7 3.7 0 0 0 5.2 5.2l3-3m3.4-5.5 2.8-2.9A3.7 3.7 0 0 0 14 3.7l-3 3"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6.5-6.5L19 12l-6.5 6.5"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M10 5H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-4m-7-9h7v7m0-7-10 10"/></symbol>
    <symbol id="i-options" viewBox="0 0 24 24"><path d="M3 6h5m4 0h9M3 18h10m4 0h4M3 12h12m4 0h2"/><circle cx="10" cy="6" r="2"/><circle cx="17" cy="12" r="2"/><circle cx="15" cy="18" r="2"/></symbol>
    <symbol id="i-activity" viewBox="0 0 24 24"><path d="M2 12h4l3.5-7 5 14 3.1-7H22"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M3.5 9V3.5H9m6 0h5.5V9m0 6v5.5H15m-6 0H3.5V15"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M15 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v3"/></symbol>
    <symbol id="i-update" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 6.1a8.3 8.3 0 0 1 12.6 1.5L20 10M4 14l1.3 2.4a8.3 8.3 0 0 0 12.6 1.5"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4m5-12 4 4-4 4m-6-4h10"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 5.4a3 3 0 0 1 0 5.4M18 14a5 5 0 0 1 3 4.5V20"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="m9.8 3-.6 2.1-2 .9-2-.6-2 3.4L4.8 10l-.1 2.3-1.6 1.6 1.9 3.4 2.3-.4 1.9 1.1.6 2h4.1l.7-2 2-1.1 2.1.4 2-3.4-1.6-1.6V10l1.5-1.4-2-3.3-2.1.6-2-.9-.7-2z"/><circle cx="12" cy="11.6" r="3.1"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></symbol>
  </svg>
  <header class="topbar">
    <div class="wordmark"><img class="brand-mark" src="../icon.png" alt="" width="36" height="36">CC Connect</div>
    <div class="header-actions">
      <div id="status-island" class="status-island">
        <div class="island-shadow"><div class="island-surface">
          <div id="island-details" class="island-details" inert aria-hidden="true"><dl><dt id="island-device-label"></dt><dd id="island-device"></dd><dt id="island-context-label"></dt><dd id="island-context"></dd></dl></div>
        </div></div>
        <button type="button" id="island-toggle" aria-expanded="false" aria-controls="island-details"><i class="state-dot" id="top-dot" aria-hidden="true"></i><span id="top-status" aria-live="polite">待连接</span><i class="island-chevron" aria-hidden="true"></i></button>
      </div>
      <div class="header-utilities">
        <button type="button" id="admin-button" class="admin-button" hidden><svg aria-hidden="true"><use href="#i-users"/></svg><span data-i18n="用户管理">用户管理</span></button>
        <button type="button" id="settings-button" class="icon-button" title="设置" data-i18n-title="设置" aria-label="设置" data-i18n-aria-label="设置"><svg aria-hidden="true"><use href="#i-gear"/></svg></button>
      </div>
    </div>
  </header>

  <main id="home" class="workspace">
    <section class="hero">
      <h1 data-i18n="远程连接">远程连接</h1>
      <img class="hero-art" src="assets/glass-displays.webp" alt="" draggable="false">
    </section>

    <section id="account-panel" class="card account-card" aria-labelledby="account-title">
      <h2 id="account-title" class="field-title" data-i18n="登录账号">登录账号</h2>
      <form id="account-form">
        <label for="account-username" class="field-label" data-i18n="用户名">用户名</label>
        <input id="account-username" type="text" autocomplete="username" spellcheck="false" autocapitalize="none" minlength="3" maxlength="40" required>
        <label for="account-password" class="field-label" data-i18n="密码">密码</label>
        <input id="account-password" type="password" autocomplete="current-password" maxlength="128" required>
        <div id="register-invite-wrap" hidden>
          <label for="register-invite" class="field-label" data-i18n="注册邀请码">注册邀请码</label>
          <input id="register-invite" type="text" maxlength="64" autocomplete="off" spellcheck="false" autocapitalize="none">
        </div>
        <p id="registration-help" class="micro" data-i18n="用户名 3–40 位，密码至少 12 位。" hidden>用户名 3–40 位，密码至少 12 位。</p>
        <div class="account-actions">
          <button id="account-submit" class="primary" type="submit" data-i18n="登录">登录</button>
          <button id="account-switch" class="text-button" type="button" data-i18n="使用邀请码注册">使用邀请码注册</button>
        </div>
      </form>
      <div id="account-wait" hidden>
        <p id="account-identity" class="micro"></p>
        <button id="account-refresh" class="secondary" type="button" data-i18n="刷新状态">刷新状态</button>
      </div>
      <p id="account-notice" class="notice" role="status" aria-live="polite" hidden></p>
    </section>
    <div id="pairing-home" class="home-grid" hidden>
      <section class="card pairing-card" aria-label="配对" data-i18n-aria-label="配对">
        <div class="switcher" role="tablist" aria-label="连接方式" data-i18n-aria-label="连接方式">
          <button type="button" id="view-tab" role="tab" aria-selected="true" aria-controls="view-panel"><svg><use href="#i-link"/></svg><span data-i18n="连接设备">连接设备</span></button>
          <button type="button" id="host-tab" role="tab" aria-selected="false" aria-controls="host-panel"><svg><use href="#i-share"/></svg><span data-i18n="共享此机">共享此机</span></button>
        </div>
        <div id="view-panel" role="tabpanel" aria-labelledby="view-tab">
          <form id="join-form">
            <label for="invite-input" class="field-title" data-i18n="对方的配对码">对方的配对码</label>
            <input id="invite-input" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="输入或粘贴配对码" data-i18n-placeholder="输入或粘贴配对码" maxlength="4096" required>
            <button class="primary full" id="join-button" type="submit"><span data-i18n="连接设备">连接设备</span><svg><use href="#i-arrow"/></svg></button>
          </form>
        </div>
        <div id="host-panel" role="tabpanel" aria-labelledby="host-tab" hidden>
          <h2 class="field-title" data-i18n="本机的配对码">本机的配对码</h2>
          <p class="field-help" id="host-help" hidden></p>
          <div id="invite-box" hidden><input id="host-invite" readonly aria-label="本机配对码" data-i18n-aria-label="本机配对码"><button id="copy-button" type="button" class="icon-button" title="复制配对码" data-i18n-title="复制配对码" aria-label="复制配对码" data-i18n-aria-label="复制配对码"><svg><use href="#i-copy"/></svg></button></div>
          <button class="text-button" id="copy-legacy" type="button" data-i18n="为旧版复制兼容码" hidden>为旧版复制兼容码</button>
          <button class="primary full" id="host-button" type="button"><span data-i18n="生成配对码">生成配对码</span><svg><use href="#i-arrow"/></svg></button>
          <button class="secondary full" id="cancel-host" type="button" hidden data-i18n="取消邀请">取消邀请</button>
        </div>
        <div id="waiting" hidden><span class="spinner"></span><span data-i18n="等待对方确认…">等待对方确认…</span><button class="text-button" id="cancel-join" type="button" data-i18n="取消">取消</button></div>
        <p class="notice" id="home-notice" role="status" hidden></p>
      </section>

      <aside class="card details-card">
        <div class="device-summary">
          <span class="device-glyph" aria-hidden="true"><svg><use href="#i-display"/></svg></span>
          <div class="device-info">
            <h2 class="card-title" data-i18n="本机设备">本机设备</h2>
            <p class="device-name" id="device-name">正在读取设备…</p>
            <p class="platform" id="device-platform">—</p>
          </div>
        </div>
        <hr>
        <div class="quality-heading"><label for="quality-select"><svg><use href="#i-activity"/></svg><span data-i18n="接收画质">接收画质</span></label></div>
        <div class="quality-controls">
          <div class="select-shell"><select id="quality-select" aria-describedby="quality-detail"><option value="smooth" data-i18n="流畅优先">流畅优先</option><option value="balanced" selected data-i18n="均衡模式">均衡模式</option><option value="detail" data-i18n="清晰优先">清晰优先</option></select></div>
          <p id="quality-detail" class="micro">最高 1080p · 60 帧/秒</p>
        </div>
      </aside>
    </div>
  </main>

  <main id="session" hidden>
    <div class="session-head"><h1 id="session-title">正在连接</h1>
      <div class="session-actions"><button class="icon-button" id="fullscreen" type="button" aria-label="切换全屏" data-i18n-aria-label="切换全屏" title="切换全屏" data-i18n-title="切换全屏" hidden><svg><use href="#i-expand"/></svg></button><button id="end-session" class="danger" type="button"><svg><use href="#i-stop"/></svg><span data-i18n="结束连接">结束连接</span></button></div>
    </div>
    <div id="viewer-stage" hidden><video id="remote-video" autoplay playsinline muted tabindex="0" aria-label="远程屏幕" data-i18n-aria-label="远程屏幕"></video><p id="video-wait" data-i18n="正在接收远程画面…">正在接收远程画面…</p></div>
    <div id="host-stage" class="card" hidden><span class="sharing-icon"><svg><use href="#i-share"/></svg></span><h2 id="sharing-title">正在建立屏幕共享</h2><button class="primary" type="button" id="resume-capture" hidden data-i18n="开始共享">开始共享</button><button class="text-button" type="button" id="session-screen-settings" hidden data-i18n="打开录屏设置">打开录屏设置</button></div>
    <div class="session-footer"><span class="permission-state" id="permission-state"></span><div class="transport-info"><svg><use href="#i-lock"/></svg><span id="session-stats">正在协商加密连接…</span></div><label id="live-quality-wrap" hidden><span data-i18n="接收画质">接收画质</span> <select id="live-quality" aria-label="接收画质" data-i18n-aria-label="接收画质"><option value="smooth" data-i18n="流畅">流畅</option><option value="balanced" selected data-i18n="均衡">均衡</option><option value="detail" data-i18n="清晰">清晰</option></select></label></div>
    <p class="notice" id="session-notice" role="status" hidden></p>
  </main>

  <dialog id="consent" aria-labelledby="consent-title">
    <form id="consent-form">
      <span class="dialog-icon"><svg><use href="#i-display"/></svg></span>
      <h2 id="consent-title">允许共享屏幕？</h2>
      <label for="screens" class="field-label" data-i18n="共享屏幕">共享屏幕</label><select id="screens" required></select>
      <label class="checkbox-row"><input type="checkbox" id="allow-control"><span data-i18n="允许对方使用键盘和鼠标">允许对方使用键盘和鼠标</span></label>
      <p id="control-note" class="micro"></p>
      <p class="notice" id="consent-notice" role="status" hidden></p>
      <div class="screen-recovery" id="screen-recovery" hidden>
        <button type="button" id="retry-screens" class="text-action" data-i18n="重新读取">重新读取</button>
        <button type="button" id="consent-screen-settings" class="text-button" data-i18n="打开录屏设置" hidden>打开录屏设置</button>
      </div>
      <div class="dialog-actions"><button type="button" id="reject" class="secondary" data-i18n="拒绝">拒绝</button><button type="submit" id="accept" class="primary" data-i18n="开始共享">开始共享</button><button type="button" id="use-system-picker" class="primary" data-i18n="选择画面 · 仅观看" hidden>选择画面 · 仅观看</button></div>
    </form>
  </dialog>

  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <div class="dialog-head"><h2 id="settings-title" data-i18n="设置">设置</h2><button type="button" id="close-settings" class="icon-button" aria-label="关闭" data-i18n-aria-label="关闭"><svg><use href="#i-close"/></svg></button></div>
    <div class="settings-list">
      <div class="settings-row"><span data-i18n="语言">语言</span><select id="language-select" aria-label="语言" data-i18n-aria-label="语言" title="语言" data-i18n-title="语言"><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="en">English</option></select></div>
      <button type="button" id="update-button" class="settings-row"><span data-i18n="软件更新">软件更新</span><span class="row-end"><span id="settings-version"></span><svg aria-hidden="true"><use href="#i-arrow"/></svg></span></button>
      <div class="settings-row account-row"><span><span data-i18n="当前账号">当前账号</span><strong id="settings-identity"></strong></span><button type="button" id="account-logout" class="text-action" data-i18n="退出账号" hidden>退出账号</button></div>
      <div class="settings-row"><span data-i18n="屏幕共享">屏幕共享</span><button type="button" id="screen-check" class="text-action" aria-controls="screen-check-result" data-i18n="检测屏幕">检测屏幕</button></div>
    </div>
    <p id="screen-check-result" class="notice" role="status" hidden></p>
    <button type="button" id="settings-screen-settings" class="text-button" data-i18n="打开录屏设置" hidden>打开录屏设置</button>
    <button type="button" id="settings-end" class="danger" data-i18n="结束连接" hidden>结束连接</button>
    <details id="advanced-settings" hidden><summary data-i18n="自定义中继">自定义中继</summary>
    <form id="settings-form">
      <label for="turn-url" class="field-label"><span data-i18n="TURN 中继">TURN 中继</span> <span data-i18n="选填">选填</span></label><input type="text" id="turn-url" placeholder="turns:turn.example.com:5349" autocomplete="off" spellcheck="false">
      <div class="credential-fields"><div><label for="turn-user" class="field-label" data-i18n="TURN 用户名">TURN 用户名</label><input type="text" id="turn-user" autocomplete="off"></div><div><label for="turn-password" class="field-label" data-i18n="TURN 密码">TURN 密码</label><input type="password" id="turn-password" autocomplete="off"></div></div>
      <p class="notice" id="settings-notice" role="status" hidden></p>
      <div class="dialog-actions"><button type="button" id="cancel-settings" class="secondary" data-i18n="取消">取消</button><button type="submit" class="primary" id="save-settings" data-i18n="保存设置">保存设置</button></div>
    </form>
    </details>
  </dialog>
  <dialog id="update-dialog" aria-labelledby="update-title">
    <div class="dialog-head"><h2 id="update-title" data-i18n="软件更新">软件更新</h2><button type="button" id="close-update" class="icon-button" aria-label="关闭" data-i18n-aria-label="关闭"><svg><use href="#i-close"/></svg></button></div>
    <div class="update-summary"><img src="../icon.png" alt="" width="52" height="52"><div><strong>CC Connect</strong><p id="update-current-version" class="micro"></p></div></div>
    <p id="update-status" class="update-status" role="status" aria-live="polite"></p>
    <progress id="update-progress" max="100" value="0" hidden aria-label="下载进度" data-i18n-aria-label="下载进度"></progress>
    <p id="update-note" class="settings-help" hidden></p>
    <div class="dialog-actions"><button type="button" id="update-action" class="primary" data-i18n="检查更新">检查更新</button></div>
  </dialog>
</body>
</html>
